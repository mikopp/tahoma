name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # pyoverkiz>=2.0 requires Python >=3.12; 3.11 can't install the real
      # dependency, so it only gets the network-free syntax check (CLAUDE.md
      # "Testing changes" step 1) instead of the full install+lint+pytest run.
      - name: Syntax check only (Python 3.11 - pyoverkiz requires >=3.12)
        if: matrix.python-version == '3.11'
        run: |
          python -c "import ast; ast.parse(open('tahoma.py',encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('get_devices_url.py',encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('tahoma_config.py',encoding='utf-8').read())"

      - run: pip install -r requirements.txt
        if: matrix.python-version != '3.11'
      - run: pip install pytest
        if: matrix.python-version != '3.11'

      - name: Lint (ruff)
        uses: astral-sh/ruff-action@v3
        if: matrix.python-version != '3.11'

      - name: Unit tests (pytest)
        run: python -m pytest -v
        if: matrix.python-version != '3.11'
